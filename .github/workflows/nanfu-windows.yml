name: Nanfu Windows baseline installer
on:
  push:
    branches: [release/nanfu-baseline]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nanfu-baseline-windows
  cancel-in-progress: false
jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      MOZILLABUILD: 'C:\mozilla-build\'
      MACH_PS1_USE_MOZILLABUILD: '1'
      MOZBUILD_STATE_PATH: 'C:\mozbuild'
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MozillaBuild
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\MozillaBuildSetup.exe"
          Invoke-WebRequest 'https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe' -OutFile $installer
          Get-FileHash $installer -Algorithm SHA256
          $p = Start-Process $installer -ArgumentList '/S', '/D=C:\mozilla-build' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MozillaBuild installer failed: $($p.ExitCode)" }
          if (!(Test-Path 'C:\mozilla-build\start-shell.bat')) { throw 'MozillaBuild shell missing' }
      - name: Prepare standalone source and configure
        shell: pwsh
        working-directory: firefox
        run: |
          git init
          git config core.longpaths true
          git config user.name 'Nanfu Build'
          git config user.email 'build@localhost'
          git add --force --all
          git commit --quiet -m 'Nanfu baseline source snapshot'
          @'
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-nanfu
          mk_add_options MOZ_MAKE_FLAGS="-j2"
          ac_add_options --enable-application=browser
          ac_add_options --enable-bootstrap
          ac_add_options --disable-debug
          ac_add_options --disable-debug-symbols
          ac_add_options --enable-optimize
          ac_add_options --disable-tests
          ac_add_options --disable-updater
          ac_add_options --disable-crashreporter
          ac_add_options --disable-maintenance-service
          ac_add_options --with-branding=browser/branding/unofficial
          '@ | Set-Content .mozconfig -Encoding utf8
      - name: Bootstrap Windows compiler toolchains
        shell: pwsh
        working-directory: firefox
        run: |
          & .\mach.ps1 --no-interactive bootstrap --application-choice browser 2>&1 | Tee-Object "$env:RUNNER_TEMP\nanfu-bootstrap.log"
          exit $LASTEXITCODE
      - name: Compile baseline from source
        shell: pwsh
        working-directory: firefox
        run: |
          & .\mach.ps1 build 2>&1 | Tee-Object "$env:RUNNER_TEMP\nanfu-build.log"
          exit $LASTEXITCODE
      - name: Check compiled browser startup
        shell: pwsh
        working-directory: firefox
        run: |
          $profile = "$env:RUNNER_TEMP\nanfu-build-profile"
          $shot = "$env:RUNNER_TEMP\nanfu-build-startup.png"
          New-Item -ItemType Directory -Force $profile | Out-Null
          $p = Start-Process '.\obj-nanfu\dist\bin\firefox.exe' -ArgumentList '--headless','--no-remote','--profile',$profile,'--screenshot',$shot,'about:blank' -PassThru
          if (!$p.WaitForExit(90000)) { $p.Kill(); throw 'Browser startup timed out' }
          if ($p.ExitCode -ne 0 -or !(Test-Path $shot)) { throw "Browser startup failed: $($p.ExitCode)" }
      - name: Build full Windows installer
        shell: pwsh
        working-directory: firefox
        run: |
          & .\mach.ps1 package 2>&1 | Tee-Object "$env:RUNNER_TEMP\nanfu-package.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem '.\obj-nanfu\dist' -Filter '*.installer.exe' | Select-Object -First 1
          if (!$installer) { throw 'Full installer not generated by mach package' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\nanfu-output" | Out-Null
          Copy-Item $installer.FullName "$env:RUNNER_TEMP\nanfu-output\Nanfu-Browser-Setup-x64.exe"
      - name: Install and verify installed browser
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\nanfu-output\Nanfu-Browser-Setup-x64.exe"
          $ini = "$env:RUNNER_TEMP\nanfu-install.ini"
          $target = "$env:RUNNER_TEMP\NanfuInstalled"
          @"
          [Install]
          InstallDirectoryPath=$target
          DesktopShortcut=false
          StartMenuShortcuts=false
          MaintenanceService=false
          "@ | Set-Content $ini -Encoding unicode
          $p = Start-Process $exe -ArgumentList '/S',"/INI=$ini" -PassThru
          if (!$p.WaitForExit(180000)) { $p.Kill(); throw 'Installer timed out' }
          if ($p.ExitCode -ne 0) { throw "Install failed: $($p.ExitCode)" }
          if (!(Test-Path "$target\firefox.exe")) { throw 'Installed executable missing' }
          $profile = "$env:RUNNER_TEMP\nanfu-installed-profile"
          $shot = "$env:RUNNER_TEMP\nanfu-installed-startup.png"
          New-Item -ItemType Directory -Force $profile | Out-Null
          $p = Start-Process "$target\firefox.exe" -ArgumentList '--headless','--no-remote','--profile',$profile,'--screenshot',$shot,'about:blank' -PassThru
          if (!$p.WaitForExit(90000)) { $p.Kill(); throw 'Installed browser startup timed out' }
          if ($p.ExitCode -ne 0 -or !(Test-Path $shot)) { throw 'Installed browser startup failed' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File "$env:RUNNER_TEMP\nanfu-output\SHA256.txt" -Encoding utf8
      - name: Upload verified Nanfu Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Nanfu-Browser-Windows-x64
          path: ${{ runner.temp }}/nanfu-output/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nanfu-Windows-diagnostics
          path: |
            ${{ runner.temp }}/nanfu-*.log
            ${{ runner.temp }}/nanfu-*-startup.png
            firefox/obj-nanfu/config.log
          if-no-files-found: warn
