name: Nanfu Windows build
on:
  push:
    branches: [feature/chromium-migration]
    paths: [.github/workflows/nanfu-windows-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vendor/aliasmode
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stage upstream required runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "aliasmode-156.0.1-beta.36-win.x86_64.zip"
          Invoke-WebRequest "https://github.com/aliasmode/aliasmode-firefox/releases/download/aliasmode-runtime-156.0.1-beta.36-r11/aliasmode-156.0.1-beta.36-win.x86_64.zip" -OutFile $archive
          $expected = "5709d0e194a2b75bcb6c909079c67404a63cca713eeca9380c409de23fb3b8b4"
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Upstream runtime checksum mismatch" }
          $extract = Join-Path $env:RUNNER_TEMP "upstream-runtime"
          Expand-Archive $archive $extract -Force
          $items = @(Get-ChildItem $extract -Recurse -File -Filter "aliasmode.exe")
          if ($items.Count -ne 1) { throw "Upstream runtime layout invalid" }
          $exeHash = (Get-FileHash -LiteralPath $items[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "ALIASMODE_FIREFOX_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALIASMODE_FIREFOX_ARCHIVE_SHA256=$expected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ALIASMODE_FIREFOX_EXECUTABLE_SHA256=$exeHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare with verified baseline Bun
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "bun-baseline.zip"
          $dir = Join-Path $env:RUNNER_TEMP "bun-baseline"
          Invoke-WebRequest "https://github.com/oven-sh/bun/releases/download/bun-v1.2.21/bun-windows-x64-baseline.zip" -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "23f2df1f40d963e5b6104e1a565df992aab8968da5004f460617073843b8b8be") { throw "Bun archive checksum mismatch" }
          Expand-Archive $zip $dir -Force
          $candidates = @(Get-ChildItem $dir -Recurse -File -Filter "bun.exe")
          if ($candidates.Count -ne 1) { throw "Invalid Bun archive" }
          & $candidates[0].FullName scripts/prepare-windows-bundle.ts
          if ($LASTEXITCODE -ne 0) { throw "Bundle preparation failed" }
      - name: Build development installer
        run: bunx tauri build --bundles nsis --no-sign
      - name: Save development installer
        uses: actions/upload-artifact@v4
        with:
          name: nanfu-chromium-unverified-windows
          path: vendor/aliasmode/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
