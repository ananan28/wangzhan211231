name: Nanfu Windows build
on:
  push:
    branches: [feature/chromium-migration]
    paths: [.github/workflows/nanfu-windows-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vendor/aliasmode
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build development installer
        run: bun run desktop:build:nsis
      - name: Save development installer
        uses: actions/upload-artifact@v4
        with:
          name: nanfu-chromium-unverified-windows
          path: vendor/aliasmode/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
