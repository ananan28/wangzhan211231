name: Nanfu Windows build
on:
  push:
    branches:
      - feature/chromium-migration
      - qoder/nanfu-release-20261029
      - qoder/nanfu-branding-20261029
    paths:
      - .github/workflows/nanfu-windows-build.yml
      - vendor/aliasmode/*.ts
      - vendor/aliasmode/scripts/**
      - vendor/aliasmode/web/**
      - vendor/aliasmode/src-tauri/nanfu.conf.json
      - vendor/aliasmode/src-tauri/src/**
      - vendor/aliasmode/src-tauri/windows/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: vendor/aliasmode
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stage the bundled Chromium runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "aliasmode-chromium-155.0.8059.85-windows-x64.zip"
          Invoke-WebRequest "https://github.com/aliasmode/aliasmode-chromium/releases/download/v155.0.8059.85-aliasmode.4/aliasmode-chromium-155.0.8059.85-windows-x64.zip" -OutFile $archive
          $expected = "cfea275e4b7f3274b701e64c0483b46cbf6cd12ead9a6cfda6ff77b2680e7a23"
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Chromium archive checksum mismatch" }
          $extract = Join-Path $env:RUNNER_TEMP "chromium-runtime"
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          & tar.exe -xf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw "Chromium archive extraction failed" }
          $root = Join-Path $extract "aliasmode-chromium-155.0.8059.85-windows-x64"
          if (!(Test-Path -LiteralPath (Join-Path $root "chrome.exe"))) { throw "Chromium runtime layout invalid" }
          "NANFU_CHROMIUM_RUNTIME=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare with verified baseline Bun
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "bun-baseline.zip"
          $dir = Join-Path $env:RUNNER_TEMP "bun-baseline"
          Invoke-WebRequest "https://github.com/oven-sh/bun/releases/download/bun-v1.2.21/bun-windows-x64-baseline.zip" -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "23f2df1f40d963e5b6104e1a565df992aab8968da5004f460617073843b8b8be") { throw "Bun archive checksum mismatch" }
          Expand-Archive $zip $dir -Force
          $candidates = @(Get-ChildItem $dir -Recurse -File -Filter "bun.exe")
          if ($candidates.Count -ne 1) { throw "Invalid Bun archive" }
          & $candidates[0].FullName scripts/prepare-windows-bundle.ts
          if ($LASTEXITCODE -ne 0) { throw "Bundle preparation failed" }
      - name: Build development installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.NANFU_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bunx tauri build --config src-tauri/nanfu.conf.json --bundles nsis
      - name: Verify branded installation starts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected one installer" }
          $installed = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Nanfu/aliasmode.exe"
          if (!(Test-Path -LiteralPath $exe)) { throw "Branded application executable missing" }
          $runtime = Join-Path $env:LOCALAPPDATA "Nanfu/chromium/chromium-155.0.8059.85-aliasmode.4/chrome.exe"
          if (!(Test-Path -LiteralPath $runtime)) { throw "Bundled Chromium runtime missing from the installation" }
          if ((Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant() -ne "0ef4de1bef7c12534031318e07ac89fa7942916a3abc89057985aafefbca619f") { throw "Bundled Chromium runtime was replaced" }
          $env:RUST_BACKTRACE = "1"
          $stderr = Join-Path $env:RUNNER_TEMP "nanfu-startup-stderr.txt"
          $stdout = Join-Path $env:RUNNER_TEMP "nanfu-startup-stdout.txt"
          $app = Start-Process -FilePath $exe -PassThru -RedirectStandardError $stderr -RedirectStandardOutput $stdout
          try {
            Start-Sleep -Seconds 15
            $app.Refresh()
            if ($app.HasExited) {
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              throw "Application exited during startup: $($app.ExitCode)"
            }
            Write-Host "Branded application survived startup"
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
          Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256
      - name: Save development installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanfu-chromium-unverified-windows
          path: |
            vendor/aliasmode/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/nanfu-startup-*.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish installer to the release channel
        if: success()
        shell: pwsh
        env:
          NANFU_UPLOAD_TOKEN: ${{ secrets.NANFU_UPLOAD_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          # The version is read from the app config so the published object key
          # always matches the installer that was just built and smoke tested.
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ("$version" -notmatch '^\d+\.\d+\.\d+(-[a-z0-9.]+)?$') {
            throw "tauri.conf.json carries an invalid version: $version"
          }
          foreach ($name in @("NANFU_UPLOAD_TOKEN", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Warning "$name is not configured; keeping the installer as a build artifact only."
              exit 0
            }
          }
          $token = "$env:NANFU_UPLOAD_TOKEN".Trim()
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected one installer to publish" }
          $installer = $installers[0]
          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = $installer.Length
          $objectKey = "nanfu/$version/win-x64/$($installer.Name)"
          $endpoint = "https://0a8dc13181086e28114bb0c6b24eac54.r2.cloudflarestorage.com"
          $bucket = "software-downloads"

          Write-Host "Uploading $($installer.Name) ($size bytes) to r2://$bucket/$objectKey"
          & curl.exe -sS -f --retry 3 --retry-delay 5 `
            --aws-sigv4 "aws:amz:auto:s3" `
            -u "$($env:R2_ACCESS_KEY_ID):$($env:R2_SECRET_ACCESS_KEY)" `
            -T $installer.FullName "$endpoint/$bucket/$objectKey"
          if ($LASTEXITCODE -ne 0) {
            throw "R2 upload failed (exit $LASTEXITCODE)."
          }

          $payload = Join-Path $env:RUNNER_TEMP "nanfu-register.json"
          @{
            action = "register"
            version = "$version"
            platform = "win-x64"
            fileName = "$($installer.Name)"
            sha256 = $sha256
            size = $size
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $payload -Encoding utf8NoBOM
          $response = Join-Path $env:RUNNER_TEMP "nanfu-release-response.json"
          $status = & curl.exe -sS -o $response -w "%{http_code}" `
            -X POST "https://zojqxzaqumrtykcufqzg.supabase.co/functions/v1/nanfu-release" `
            -H "x-nanfu-upload-token: $token" `
            -H "content-type: application/json" `
            --data-binary "@$payload"
          if ($LASTEXITCODE -ne 0) {
            throw "curl failed while registering the release (exit $LASTEXITCODE)."
          }
          $status = "$status".Trim()
          Write-Host "Release registration responded with HTTP $status"
          Get-Content -LiteralPath $response -Raw -Encoding utf8
          if ($status -ne "200") {
            throw "Release registration failed with HTTP $status."
          }
      - name: Publish updater manifest
        if: success()
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          # Tauri signs the installer and writes a one-platform manifest beside it.
          $manifest = Get-ChildItem $bundleDir -Filter "*.json" -File |
            Where-Object { (Get-Content $_.FullName -Raw) -match '"platforms"' } |
            Select-Object -First 1
          if (-not $manifest) { throw "No updater manifest was produced" }
          $installers = @(Get-ChildItem $bundleDir -Filter "*.exe" -File | Where-Object { $_.Name -like "*setup*" })
          if ($installers.Count -ne 1) { throw "Expected one installer beside the manifest" }
          $installer = $installers[0]
          $manifestJson = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          # The generated url is relative to the manifest; point it at the already-published installer.
          $manifestJson.platforms.'windows-x86_64'.url = "https://dl.xzckfn.eu.cc/nanfu/$version/win-x64/$($installer.Name)"
          if (-not ($manifestJson.platforms.'windows-x86_64'.signature)) { throw "Updater manifest has no signature" }
          $body = $manifestJson | ConvertTo-Json -Depth 8 -Compress
          $objectKey = "nanfu/update/win-x64/latest-v2.json"
          $endpoint = "https://0a8dc13181086e28114bb0c6b24eac54.r2.cloudflarestorage.com"
          $bucket = "software-downloads"
          $tmp = Join-Path $env:RUNNER_TEMP "latest-v2.json"
          Set-Content -LiteralPath $tmp -Value $body -Encoding utf8NoBOM
          & curl.exe -sS -f --retry 3 --retry-delay 5 `
            --aws-sigv4 "aws:amz:auto:s3" `
            -u "$($env:R2_ACCESS_KEY_ID):$($env:R2_SECRET_ACCESS_KEY)" `
            -H "content-type: application/json" `
            -T $tmp "$endpoint/$bucket/$objectKey"
          if ($LASTEXITCODE -ne 0) { throw "R2 updater manifest upload failed" }
          Write-Host "Updater manifest published to $objectKey"
          Write-Host $body
