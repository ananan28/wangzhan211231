# Nanfu macOS app build.
#
# Consumes a kernel artifact from a successful "Nanfu macOS kernel" run, stages the kernel archive
# as the app's bundled Chromium (scripts/prepare-macos-bundle.ts), then builds the Tauri app and
# the .dmg. The app extracts the archive into its data directory on first launch; Tauri's resource
# copy resolves symlinks, which would flatten Chromium Framework if the app shipped it unpacked.
# The Nanfu macOS app ships no Firefox: Chromium is the only engine, as on Windows.
#
# The kernel is not downloaded from a release. Dispatch the kernel workflow first, then pass its
# run id here (Actions -> Nanfu macOS kernel -> the run -> the number in the URL).
#
# This workflow is a development build: it does not publish to R2 and it is not notarized, so the
# .dmg opens only after the quarantine attribute is removed unless the kernel was Developer ID
# signed and the shell is signed with the same team.
name: Nanfu macOS build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture (universal pairs the arm64 sidecar and Node with the arm64 kernel)"
        type: choice
        default: arm64
        options:
          - arm64
          - x64
          - universal
      kernel_run_id:
        description: "Run ID of a successful 'Nanfu macOS kernel' build (the number in its URL)"
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    # macos-15 is Apple silicon and can cross-build x86_64 for the universal Rust binary;
    # macos-15-intel is a native Intel host.
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 180
    defaults:
      run:
        working-directory: vendor/aliasmode
    env:
      TARGET_TRIPLE: ${{ inputs.arch == 'arm64' && 'aarch64-apple-darwin' || inputs.arch == 'x64' && 'x86_64-apple-darwin' || 'universal-apple-darwin' }}
      NANFU_MACOS_TARGET: ${{ inputs.arch == 'arm64' && 'aarch64-apple-darwin' || inputs.arch == 'x64' && 'x86_64-apple-darwin' || 'universal' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.arch == 'arm64' && 'aarch64-apple-darwin' || inputs.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin,x86_64-apple-darwin' }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download the Chromium kernel artifact
        uses: actions/download-artifact@v4
        with:
          # A universal app still carries one kernel; the arm64 kernel is the published one.
          name: ${{ inputs.arch == 'x64' && 'nanfu-macos-kernel-macos-x64' || 'nanfu-macos-kernel-macos-arm64' }}
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/nanfu-kernel
      - name: Resolve the kernel archive and its SHA-256
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/nanfu-kernel" -type f -name '*.zip' -print -quit)"
          if [ -z "$archive" ]; then
            echo "::error::the downloaded kernel artifact contains no .zip"
            exit 1
          fi
          sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          echo "NANFU_CHROMIUM_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "NANFU_CHROMIUM_SHA256=$sha" >> "$GITHUB_ENV"
          echo "Chromium kernel: $archive ($sha)"
          echo "Kernel archive top-level entries:"
          unzip -Z1 "$archive" | head -30
          echo "Kernel archive app executables:"
          unzip -Z1 "$archive" | grep -E 'Chromium\.app/Contents/MacOS/' | head -10 || true
      - name: Prepare the bundle (kernel, sidecar, Playwright runtime)
        run: bun scripts/prepare-macos-bundle.ts
      - name: Build the app bundle
        run: |
          bunx tauri build \
            --config src-tauri/nanfu.conf.json \
            --config src-tauri/tauri.macos.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' \
            --bundles app \
            --target "$TARGET_TRIPLE"
      - name: Re-sign the app and create the disk image
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET_TRIPLE/release/bundle"
          app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::the build produced no .app"
            exit 1
          fi
          # The kernel ships as a zip resource and the app extracts it on first launch, so the only
          # bundle to seal is the outer app. Tauri's resource copy invalidates its signature, so
          # re-seal it ad-hoc before the dmg is made.
          xattr -cr "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p "$bundle/dmg"
          dmg="$bundle/dmg/Nanfu-macos-${{ inputs.arch }}.dmg"
          rm -f "$dmg"
          # 标准拖拽安装窗口：应用 + “应用程序”快捷方式，双击 dmg 后直接拖进去即可。
          stage="$RUNNER_TEMP/nanfu-dmg-stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto "$app" "$stage/$(basename "$app")"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "南孚浏览器" -srcfolder "$stage" -ov -format UDZO "$dmg"
          rm -rf "$stage"
          ls -lh "$dmg"
          du -sh "$app" "$dmg"
      - name: Verify the bundle carries the kernel archive and the runtimes
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET_TRIPLE/release/bundle"
          app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$app" ] || [ -z "$dmg" ]; then
            echo "::error::the build produced no .app or no .dmg"
            exit 1
          fi
          kernel="$app/Contents/Resources/chromium/nanfu-kernel.zip"
          manifest="$app/Contents/Resources/chromium/nanfu-kernel.json"
          for required in \
            "$kernel" \
            "$manifest" \
            "$app/Contents/Resources/playwright/node/node" \
            "$app/Contents/MacOS/aliasmode-sidecar" \
            "$app/Contents/MacOS/aliasmode-mcp"; do
            if [ ! -f "$required" ]; then
              echo "::error::a packaged runtime is missing: $required"
              exit 1
            fi
          done
          # The kernel must ship as one archive: an unpacked Chromium.app here is the flattened
          # bundle this build deliberately avoids.
          unpacked="$(find "$app/Contents/Resources/chromium" -maxdepth 2 -type d -name 'Chromium.app' -print)"
          if [ -n "$unpacked" ]; then
            echo "::error::the kernel must ship as an archive, not an unpacked Chromium.app"
            exit 1
          fi
          if ! entries="$(unzip -Z1 "$kernel")"; then
            echo "::error::could not list the kernel archive: $kernel"
            exit 1
          fi
          if ! grep -qE '(^|/)Chromium\.app/Contents/MacOS/Chromium$' <<< "$entries"; then
            echo "::error::the kernel archive has no Chromium.app/Contents/MacOS/Chromium"
            exit 1
          fi
          recorded="$(sed -n 's/.*"archiveSha256"[[:space:]]*:[[:space:]]*"\([0-9a-f]\{64\}\)".*/\1/p' "$manifest")"
          measured="$(shasum -a 256 "$kernel" | awk '{print $1}')"
          if [ -z "$recorded" ] || [ "$recorded" != "$measured" ]; then
            echo "::error::the kernel archive does not match the manifest SHA-256: $measured vs ${recorded:-<none>}"
            exit 1
          fi
          if [ -d "$app/Contents/Resources/firefox" ]; then
            echo "::error::the macOS bundle must not ship Firefox"
            exit 1
          fi
          echo "bundled kernel: $kernel"
          lipo -archs "$app/Contents/MacOS/aliasmode-sidecar"
          codesign --verify --deep --strict "$app"
          du -sh "$app" "$kernel" "$dmg"
          shasum -a 256 "$dmg"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/nanfu-macos-${{ inputs.arch }}-app.zip"
      - name: Upload the macOS build
        uses: actions/upload-artifact@v4
        with:
          name: nanfu-macos-${{ inputs.arch }}
          path: |
            vendor/aliasmode/src-tauri/target/${{ env.TARGET_TRIPLE }}/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/nanfu-macos-${{ inputs.arch }}-app.zip
          if-no-files-found: error
          retention-days: 7
      # GitHub artifact storage is far too slow to fetch from China (a 287 MB
      # dmg measured ~20 KB/s). Publish the dmg to the same R2/CDN the Windows
      # installer uses, so the download site can link it immediately.
      - name: Publish the dmg to R2
        if: success()
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::warning::R2 credentials are not configured; keeping the dmg as a build artifact only."
            exit 0
          fi
          version="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]; then
            echo "::error::tauri.conf.json carries an invalid version: $version"
            exit 1
          fi
          case "${{ inputs.arch }}" in
            arm64) platform="mac-arm"; suffix="arm64" ;;
            x64) platform="mac-intel"; suffix="x64" ;;
            *) platform="mac-universal"; suffix="universal" ;;
          esac
          dmg="$(find "src-tauri/target/$TARGET_TRIPLE/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ] || [ ! -f "$dmg" ]; then
            echo "::error::no dmg to publish"
            exit 1
          fi
          key="nanfu/$version/$platform/Nanfu_${version}_${suffix}.dmg"
          endpoint="https://0a8dc13181086e28114bb0c6b24eac54.r2.cloudflarestorage.com"
          bucket="software-downloads"
          du -sh "$dmg"
          shasum -a 256 "$dmg"
          curl -sS -f --retry 3 --retry-delay 5 \
            --aws-sigv4 "aws:amz:auto:s3" \
            -u "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" \
            -T "$dmg" "$endpoint/$bucket/$key"
          echo "Published https://dl.xzckfn.eu.cc/$key"

