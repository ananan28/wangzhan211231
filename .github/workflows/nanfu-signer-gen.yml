name: Nanfu updater signer keygen (one-off)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: vendor/aliasmode
      - name: Generate the updater signing keypair
        run: |
          bunx tauri signer generate -w nanfu-updater.key --ci
          echo "===NANFU_UPDATER_PUBKEY_BEGIN==="
          cat nanfu-updater.key.pub
          echo "===NANFU_UPDATER_PUBKEY_END==="
          echo "===NANFU_UPDATER_SECRET_B64_BEGIN==="
          base64 -w0 nanfu-updater.key
          echo
          echo "===NANFU_UPDATER_SECRET_B64_END==="
        working-directory: vendor/aliasmode
